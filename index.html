<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RangeÇa 🧹</title>
    <meta name="theme-color" content="#171923">

    <link rel="icon" href="./logorc.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">

    <script src="./script.js" defer></script>
</head>

<body>

    <header>
        <div class="logo">🧹 RangeÇa</div>
        <p>Transforme ton bazar en quelque chose de clair.</p>
    </header>

    <main>

        <section class="ajout">
            <h2>Qu'est-ce que tu as à faire ?</h2>

            <textarea
                id="texte"
                placeholder="Exemple :&#10;Faire mes devoirs de maths&#10;Acheter du pain&#10;Aller au sport..."
            ></textarea>

            <button id="boutonRanger" class="btn-principal" type="button">
                Ranger mes tâches ✨
            </button>

            <p id="message" aria-live="polite"></p>
        </section>

        <section class="taches">

            <div class="titre-taches">
                <h2>Mes tâches</h2>
                <span id="compteur">0 tâche</span>
            </div>

            <div class="filtres">
                <button class="filtre actif" data-filtre="toutes" type="button">
                    Toutes
                </button>

                <button class="filtre" data-filtre="actives" type="button">
                    À faire
                </button>

                <button class="filtre" data-filtre="terminees" type="button">
                    Terminées
                </button>
            </div>

            <div id="resultat"></div>

            <button id="supprimerTerminees" class="btn-secondaire" type="button">
                Supprimer les tâches terminées
            </button>

        </section>

    </main>

    <footer>
        <p>RangeÇa 🧹 — Organise ta vie simplement.</p>
    </footer>

</body>
</html>
